name: Deploy API to VM

on:
  push:
    branches:
      - main  # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{  }}


      - name: Install dependencies
        run: |
          npm install

      - name: Copy project files to VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@48.217.232.174 "mkdir -p ~/say-hello-api"
          scp -o StrictHostKeyChecking=no -r ./* azureuser@48.217.232.174:~/say-hello-api

      - name: Restart server on VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@48.217.232.174 "cd ~/say-hello-api && pm2 restart server.js || pm2 start server.js"

      - name: Clean up
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@48.217.232.174 "cd ~/say-hello-api && pm2 save"
